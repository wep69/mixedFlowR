# Navegacao das vinhetas conforme mixedFlowR_VIGNETTES_BLOCK_ORGANIZATION_UPDATED.md:
# Start Here (visao geral) primeiro, depois os cinco blocos progressivos.
articles:
  - title: "Start Here: complete workflow overview"
    desc: >
      The orientation map of the package: the full analytical flow, how the modules
      connect, and where each step is executed.
    contents:
      - v00-start-here-overview

  - title: "Block 1: foundations and core mixed models"
    desc: >
      The package, experimental-unit logic, legacy split-plot analysis, random
      effects, shrinkage, and the transition from LMM to GLMM.
    contents:
      - v01-quick-start
      - v02-design-legacy-splitplot
      - v03-random-effects-and-shrinkage
      - v04-glmm-distributions

  - title: "Block 2: dependence, quantitative effects, diagnostics and robustness"
    desc: >
      Residual covariance and heteroscedasticity, qualitative versus quantitative
      factors, diagnostics, model comparison, influence, and robust sensitivity.
    contents:
      - v05-residual-covariance
      - v10-qualitative-quantitative
      - v14-diagnostics-comparison
      - v06-robust-sensitivity

  - title: "Block 3: advanced inference and distributional modelling"
    desc: >
      Bootstrap inference, mixed GAMLSS, Bayesian multilevel models, nonlinear
      mixed models, growth curves, dose response, and random regression.
    contents:
      - v07-bootstrap-inference
      - v08-gamlss-mixed
      - v09-bayesian-multilevel
      - v11-nonlinear-random-regression

  - title: "Block 4: spatial, MET, publication and teaching"
    desc: >
      Spatial field trials, multi-environment trials and GxE, publication-ready
      tables and figures, and guided teaching workflows.
    contents:
      - v12-spatial-field-trials
      - v13-met-gxe
      - v15-publication-output
      - v16-teaching-tour

  - title: "Block 5: state of the art, validation and complete workflows"
    desc: >
      The package within the mixed-model ecosystem, validation and reproducibility,
      the integrated agronomic workflow, and the API-wide example catalogue.
    contents:
      - v17-state-of-the-art
      - v18-validation-reproducibility
      - v19-complete-agronomic-workflow
      - v20-api-example-catalog

